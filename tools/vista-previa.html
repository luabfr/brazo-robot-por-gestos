<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vista previa para redes · Brazo robot por gestos</title>
  <!-- Plantilla de la imagen que muestran LinkedIn, WhatsApp y otras redes al compartir un enlace del sitio
       (1200 × 630). No es una página del sitio: tools/vista-previa.mjs la abre en un navegador headless y la
       guarda como assets/vista-previa.jpg. Usa las mismas capturas de assets/capturas/ que la infografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=block" />
  <style>
    /* Mismos colores que css/app.css (tema claro): cada zona del recorrido tiene el suyo */
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1b1f2a;
      --muted: #5b6475;
      --border: #dfe3ec;
      --stage-bg: #0b0e13;
      --zone-student: #3b5bdb;
      --zone-student-tint: #e9eeff;
      --zone-cloud: #9332b0;
      --zone-cloud-tint: #f5eafa;
      --zone-teacher: #0b7476;
      --zone-teacher-tint: #e2f3f3;
      --zone-robot: #a8500a;
      --zone-robot-tint: #fdf0e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 44px 48px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
    }

    .eyebrow {
      color: var(--zone-teacher);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 6px;
      font-size: 66px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 720px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.35;
    }

    /* Las tecnologías, con el color de la zona donde trabaja cada una (como en la portada) */
    .tech {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 10px;
      padding-bottom: 4px;
    }

    .tech span {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--tint);
      color: var(--zone);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .zone-student { --zone: var(--zone-student); --tint: var(--zone-student-tint); }
    .zone-cloud { --zone: var(--zone-cloud); --tint: var(--zone-cloud-tint); }
    .zone-teacher { --zone: var(--zone-teacher); --tint: var(--zone-teacher-tint); }
    .zone-robot { --zone: var(--zone-robot); --tint: var(--zone-robot-tint); }

    /* La escena: la cámara del alumno, el puente MQTT y el brazo en vivo (las dos pantallas del emisor) */
    .scene {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr);
      align-items: center;
      margin-top: auto;
    }

    .shot {
      overflow: hidden;
      aspect-ratio: 1358 / 773;
      border: 3px solid var(--zone);
      border-radius: 20px;
      background: var(--stage-bg);
      box-shadow: 0 14px 34px rgba(20, 30, 60, 0.16);
    }

    /* Las capturas traen un margen de página alrededor del video: se recorta para que el video llene la tarjeta */
    .shot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-view-box: inset(1.6% 1% 1.6% 1%);
    }

    .caption {
      margin-top: 12px;
      color: var(--zone);
      font-size: 18px;
      font-weight: 700;
    }

    .caption span {
      color: var(--muted);
      font-weight: 500;
    }

    .bridge {
      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
      margin-top: -32px; /* centrado con las tarjetas, sin contar el epígrafe */
    }

    /* Línea con flecha del índigo del alumno al verde azulado del profesor, como en la portada */
    .bridge::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 4px;
      right: 6px;
      height: 4px;
      margin-top: -2px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--zone-student), var(--zone-cloud), var(--zone-teacher));
    }

    .bridge::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid var(--zone-teacher);
      transform: translateY(-50%);
    }

    .bridge-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--zone-cloud);
      color: #ffffff;
      box-shadow: 0 0 0 6px var(--bg);
    }

    .bridge-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bridge-label {
      position: absolute;
      top: calc(50% + 34px);
      color: var(--zone-cloud);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header class="head">
    <div>
      <p class="eyebrow">Curso de robótica con Arduino</p>
      <h1>Brazo robot por gestos</h1>
      <p class="lead">Un alumno mueve la mano frente a su webcam y, a miles de kilómetros, un Arduino responde.</p>
    </div>
    <div class="tech">
      <span class="zone-student">MediaPipe</span>
      <span class="zone-cloud">MQTT</span>
      <span class="zone-teacher">Web Serial</span>
      <span class="zone-robot">Arduino</span>
    </div>
  </header>

  <div class="scene">
    <figure class="zone-student">
      <div class="shot"><img src="../assets/capturas/emisor-camara.webp" alt="" /></div>
      <figcaption class="caption">Alumno <span>· su mano, detectada en el navegador</span></figcaption>
    </figure>
    <div class="bridge">
      <span class="bridge-icon"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></svg></span>
      <span class="bridge-label">MQTT</span>
    </div>
    <figure class="zone-teacher">
      <div class="shot"><img src="../assets/capturas/emisor-brazo.webp" alt="" /></div>
      <figcaption class="caption">Profesor <span>· el brazo, en vivo</span></figcaption>
    </figure>
  </div>
</body>
</html>
